name: Submit a project Profile
description: Add a project that Impacts can reference.
title: '[Profile] '
body:
  - type: markdown
    attributes:
      value: 'Complete the JSON below. Use a unique lowercase, hyphenated id. Types: research, model, system, product, dataset. A moderator reviews the generated PR.'
  - type: textarea
    id: record
    attributes:
      label: Profile JSON
      description: 'Contributors can be a list or comma-separated names. Omit sources if unavailable. Optional image: direct HTTPS URL.'
      render: json
      value: |
        {
          "id": "project-id",
          "name": "",
          "types": ["research"],
          "description": "",
          "url": "https://",
          "sources": ["https://"],
          "contributors": []
        }
    validations:
      required: true
  - type: dropdown
    id: contributor
    attributes:
      label: Are you one of the contributor(s)?
      description: To this project. This answer is self-reported.
      options: ['Yes', 'No']
    validations:
      required: true
  - type: checkboxes
    id: image
    attributes:
      label: Image permission
      options:
        - label: I have permission to publish any supplied image.
