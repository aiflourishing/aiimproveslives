name: Submit an Impact
description: Document a realized benefit to multiple people.
title: '[Impact] '
body:
  - type: markdown
    attributes:
      value: 'Complete the JSON below. Describe what the project does, how many people benefited, and what improved in their lives; support claims with sources. Say when numbers are unknown. A moderator reviews the generated PR. Submit a new Profile first if needed.'
  - type: textarea
    id: record
    attributes:
      label: Impact JSON
      description: 'Do not add an id. Optional fields: contributors and cites (lists or comma-separated names), image (direct HTTPS URL).'
      render: json
      value: |
        {
          "profile_id": "@project-id",
          "title": "",
          "description": "",
          "sources": ["https://"],
          "contributors": [],
          "cites": []
        }
    validations:
      required: true
  - type: dropdown
    id: contributor
    attributes:
      label: Are you one of the contributor(s)?
      description: To this Impact. This answer is self-reported.
      options: ['Yes', 'No']
    validations:
      required: true
  - type: checkboxes
    id: image
    attributes:
      label: Image permission
      options:
        - label: I have permission to publish any supplied image.
