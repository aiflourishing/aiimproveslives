name: Submit an Impact
description: Document a realized benefit to multiple people.
title: '[Impact] '
body:
  - type: markdown
    attributes:
      value: 'Complete the JSON below. Describe what the AI system does, how many people benefited, and what improved in their lives; support claims with sources. Say when numbers are unknown. A moderator reviews the generated PR.'
  - type: textarea
    id: record
    attributes:
      label: Impact JSON
      description: 'Do not add an id. occurred_by: Date by which impact occurred, in YYYY/MM/DD format. Optional field: image (direct HTTPS URL).'
      render: json
      value: |
        {
          "title": "",
          "description": "",
          "occurred_by": "YYYY/MM/DD",
          "sources": ["https://"]
        }
    validations:
      required: true
  - type: dropdown
    id: contributor
    attributes:
      label: Are you one of the contributor(s)?
      description: To this Impact. This answer is self-reported.
      options: ['Yes', 'No']
    validations:
      required: true
