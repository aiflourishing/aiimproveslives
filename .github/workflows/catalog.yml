name: Build catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.build_catalog
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: dist/catalog.json
          if-no-files-found: error
