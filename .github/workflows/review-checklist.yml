name: Verify moderator checklist
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
  statuses: write
concurrency:
  group: moderator-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checklist:
    name: Check moderator checklist
    runs-on: ubuntu-latest
    steps:
      # Only execute trusted default-branch code, never the submitted PR checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { run } = require('./scripts/review_checklist.cjs');
            await run({ github, context, core });
