name: Verify moderator checklist
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
  statuses: write
concurrency:
  group: moderator-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checklist:
    name: Check moderator checklist
    runs-on: ubuntu-latest
    if: github.event.action != 'edited' || github.event.changes.body != null
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Load only the small checker from the trusted default branch; no checkout.
            const { data } = await github.rest.repos.getContent({
              ...context.repo,
              path: 'supabase/functions/_shared/review-checklist.mjs',
              ref: context.payload.repository.default_branch
            });
            const source = Buffer.from(data.content, 'base64').toString('base64');
            const { run } = await import('data:text/javascript;base64,' + source);
            await run({ github, context, core });
