name: Issue intake
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  intake:
    if: >-
      !github.event.issue.pull_request && github.event.sender.type != 'Bot' &&
      (github.event_name == 'issues' || startsWith(github.event.comment.body, '/update'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python -m scripts.intake
        env:
          GH_TOKEN: ${{ github.token }}
